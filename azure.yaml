# Azure Developer CLI (azd) manifest for AETHER PITCH
# Deploy:  azd up
name: aether-pitch
metadata:
  template: aether-pitch@3.0.0

services:
  engine:
    project: ./backend
    language: python
    host: containerapp
    docker:
      path: ./Dockerfile
    env:
      - name: MATCH_TIME_SCALE
        value: "6.0"
      - name: MATCH_START_MINUTE
        value: "62.0"
      - name: AZURE_OPENAI_ENDPOINT
        value: ${AZURE_OPENAI_ENDPOINT}
      - name: AZURE_OPENAI_API_KEY
        value: ${AZURE_OPENAI_API_KEY}
      - name: AZURE_OPENAI_NARRATIVE_DEPLOYMENT
        value: ${AZURE_OPENAI_NARRATIVE_DEPLOYMENT}
      - name: AZURE_OPENAI_TRIAGE_DEPLOYMENT
        value: ${AZURE_OPENAI_TRIAGE_DEPLOYMENT}
      - name: AZURE_TRANSLATOR_KEY
        value: ${AZURE_TRANSLATOR_KEY}
      - name: AZURE_TRANSLATOR_REGION
        value: ${AZURE_TRANSLATOR_REGION}
      - name: AZURE_TRANSLATOR_ENDPOINT
        value: ${AZURE_TRANSLATOR_ENDPOINT}

  studio:
    project: ./frontend
    language: js
    host: containerapp
    docker:
      path: ./Dockerfile
    env:
      # Runtime configuration: the Next.js server reads these per request and
      # inlines them into the page. `NEXT_PUBLIC_*` would be frozen into the
      # bundle at build time and would point the browser at the wrong host.
      #
      # `azd` cannot cross-reference the engine's public FQDN, so the WebSocket
      # URL needs one manual step after the first deploy:
      #
      #   azd up
      #   azd env get-values                     # copy the engine FQDN
      #   azd env set AETHER_WS_URL wss://<engine-fqdn>
      #   azd deploy
      #
      # Until that is set the studio still runs — the resilient engine falls
      # back to the browser-native twin — but the badge will read EDGE rather
      # than LIVE. `infra/main.json` wires the FQDN automatically.
      - name: AETHER_API_URL
        value: ${AETHER_API_URL}
      - name: AETHER_WS_URL
        value: ${AETHER_WS_URL}
      - name: BACKEND_ORIGIN
        value: http://engine:8000
