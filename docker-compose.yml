version: "3.9"

# AETHER PITCH — local cloud-native stack
#   docker compose up --build
#   studio:  http://localhost:3000   engine: http://localhost:8000/docs

services:
  backend:
    build: ./backend
    container_name: aether-engine
    ports:
      - "8000:8000"
    environment:
      - MATCH_TIME_SCALE=6.0
      - MATCH_START_MINUTE=62.0
      # Optional Azure AI Foundry / Translator credentials
      - AZURE_OPENAI_ENDPOINT=${AZURE_OPENAI_ENDPOINT:-}
      - AZURE_OPENAI_API_KEY=${AZURE_OPENAI_API_KEY:-}
      - AZURE_OPENAI_NARRATIVE_DEPLOYMENT=${AZURE_OPENAI_NARRATIVE_DEPLOYMENT:-gpt-4o}
      - AZURE_OPENAI_TRIAGE_DEPLOYMENT=${AZURE_OPENAI_TRIAGE_DEPLOYMENT:-gpt-4o-mini}
      - AZURE_TRANSLATOR_KEY=${AZURE_TRANSLATOR_KEY:-}
      - AZURE_TRANSLATOR_REGION=${AZURE_TRANSLATOR_REGION:-global}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 15s
      timeout: 5s
      retries: 5

  frontend:
    build: ./frontend
    container_name: aether-studio
    ports:
      - "3000:3000"
    environment:
      # Runtime (not build-time) configuration. The server reads these per
      # request and inlines them into the page, so the browser always finds
      # the engine. Set AETHER_API_URL to the engine's public URL in a cloud
      # deployment, or leave it empty to use the same-origin proxy.
      AETHER_API_URL=${AETHER_API_URL:-http://localhost:8000}
      AETHER_WS_URL=${AETHER_WS_URL:-ws://localhost:8000/ws}
      BACKEND_ORIGIN=${BACKEND_ORIGIN:-http://backend:8000}
    depends_on:
      backend:
        condition: service_healthy
